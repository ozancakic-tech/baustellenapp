<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f2937"><link rel="manifest" href="manifest.json"><title>Baustellen-Doku V3</title>
<style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#17202a}header{background:#1f2937;color:#fff;padding:18px}main{max-width:1000px;margin:auto;padding:15px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:15px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}input,textarea,select,button{width:100%;padding:11px;margin:4px 0;box-sizing:border-box;border-radius:9px;border:1px solid #ccc}button{background:#2563eb;color:#fff;border:0;font-weight:700}.gray{background:#e5e7eb;color:#111}.danger{background:#dc2626}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.ok{color:#15803d;font-weight:bold}.bad{color:#b91c1c;font-weight:bold}.check{display:block;padding:8px;border-bottom:1px solid #eee}.small{font-size:12px;color:#666}</style>
</head><body><header>🏗️ <b>Baustellen-Dokumentation V3</b></header><main>
<section id="home" class="card"><h2>Meine Baustellen</h2><div id="projects"></div><button onclick="newProject()">➕ Neue Baustelle</button></section>
<section id="editor" class="card hidden"><h2>Stammdaten</h2><div class="grid">
<input id="name" placeholder="Projektname *"><input id="address" placeholder="Adresse"><input id="builder" placeholder="Bauherr"><input id="contact" placeholder="Ansprechpartner / Telefon"><input id="company" placeholder="Baufirma / Bauleitung"><input id="number" placeholder="Projektnummer"><input id="start" type="date"><input id="end" type="date"></div><textarea id="info" placeholder="Allgemeine Informationen"></textarea><button onclick="saveProject()">💾 Speichern</button><button class="gray" onclick="home()">Zur Übersicht</button></section>
<section id="project" class="hidden"><div class="card"><h2 id="pt"></h2><div id="master"></div><button onclick="newVisit()">➕ Baustellenbesuch</button><button class="gray" onclick="editProject()">✏️ Stammdaten</button><button onclick="fullPDF()">📕 Gesamtbericht PDF</button></div><div class="card"><h2>📅 Besuche</h2><div id="visits"></div></div><div class="card"><h2>⚠️ Offene Mängel</h2><div id="defects"></div></div><div class="card"><h2>✅ Checkliste</h2><select id="category" onchange="renderChecks()"></select><div id="checks"></div></div></section>
<section id="visit" class="card hidden"><h2>📅 Baustellenbesuch</h2><div class="grid"><input id="date" type="datetime-local"><input id="visitor" placeholder="Besucher / Bauleiter"><select id="area"></select><select id="status"><option>OK</option><option>Mangel</option><option>Nachbesserung</option><option>Erledigt</option></select><select id="priority"><option>Niedrig</option><option>Mittel</option><option>Hoch</option></select><input id="deadline" type="date"></div><textarea id="comment" rows="5" placeholder="Feststellungen / Kommentare"></textarea><input id="photos" type="file" accept="image/*" multiple capture="environment"><button onclick="saveVisit()">💾 Besuch speichern</button><button class="gray" onclick="showProject()">Abbrechen</button></section>
</main>
<script>
const cats={Elektro:["Steckdosen vollständig","Schalter korrekt","Leitungen fachgerecht","Unterverteilung geprüft","Beschriftungen vorhanden"],Heizung:["Leitungen kontrolliert","Fußbodenheizung kontrolliert","Heizkörper montiert","Anschlüsse geprüft"],Sanitär:["Wasserleitungen kontrolliert","Abwasserleitungen kontrolliert","Dichtheit geprüft","Anschlüsse geprüft"],"Fenster/Türen":["Keine Beschädigungen","Dichtungen geprüft","Funktion geprüft","Ausrichtung geprüft"],"Estrich/Boden":["Oberfläche geprüft","Keine relevanten Risse","Ebenheit geprüft","Feuchtigkeit geprüft"],Dach:["Dachfläche kontrolliert","Abdichtungen geprüft","Durchdringungen geprüft","Entwässerung geprüft"],Trockenbau:["Wände eben","Fugen sauber","Keine Risse","Oberfläche bereit"],Malerarbeiten:["Flächen gleichmäßig","Kanten sauber","Keine Schäden","Decken geprüft"]};
const areas=["Küche","Bad","Elektro","Heizung","Sanitär","Fenster/Türen","Estrich/Boden","Dach","Fassade","Trockenbau","Malerarbeiten","Sonstiges"];
let DB,cur=null;const $=x=>document.getElementById(x),esc=x=>(x??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open("BaustellenDokuV3",1);r.onupgradeneeded=()=>{let d=r.result;d.objectStoreNames.contains("projects")||d.createObjectStore("projects",{keyPath:"id"});if(!d.objectStoreNames.contains("visits")){let s=d.createObjectStore("visits",{keyPath:"id"});s.createIndex("projectId","projectId")}if(!d.objectStoreNames.contains("checks")){let s=d.createObjectStore("checks",{keyPath:"id"});s.createIndex("projectId","projectId")}};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function req(r){return new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}function all(s){return req(DB.transaction(s).objectStore(s).getAll())}function get(s,i){return req(DB.transaction(s).objectStore(s).get(i))}function put(s,o){return req(DB.transaction(s,"readwrite").objectStore(s).put(o))}function del(s,i){return req(DB.transaction(s,"readwrite").objectStore(s).delete(i))}
function show(id){["home","editor","project","visit"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
async function home(){show("home");let ps=await all("projects"),vs=await all("visits");$("projects").innerHTML=ps.length?`<table><tr><th>Baustelle</th><th>Adresse</th><th>Besuche</th><th>Mängel</th><th></th></tr>${ps.map(p=>{let q=vs.filter(v=>v.projectId===p.id);return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.address)}</td><td>${q.length}</td><td>${q.filter(v=>v.status==="Mangel"||v.status==="Nachbesserung").length}</td><td><button onclick="openProject('${p.id}')">Öffnen</button></td></tr>`}).join("")}</table>`:"Noch keine Baustellen."}
function newProject(){cur=null;["name","address","builder","contact","company","number","start","end","info"].forEach(x=>$(x).value="");show("editor")}
async function saveProject(){if(!$("name").value.trim())return alert("Projektname fehlt.");cur=cur||crypto.randomUUID();await put("projects",{id:cur,name:$("name").value.trim(),address:$("address").value,builder:$("builder").value,contact:$("contact").value,company:$("company").value,number:$("number").value,start:$("start").value,end:$("end").value,info:$("info").value});openProject(cur)}
async function openProject(id){cur=id;let p=await get("projects",cur);$("pt").textContent="🏗️ "+p.name;$("master").innerHTML=`<b>Adresse:</b> ${esc(p.address)}<br><b>Bauherr:</b> ${esc(p.builder)}<br><b>Ansprechpartner:</b> ${esc(p.contact)}<br><b>Baufirma:</b> ${esc(p.company)}<br><b>Projektnummer:</b> ${esc(p.number)}<br><b>Zeitraum:</b> ${esc(p.start)} – ${esc(p.end)}<p>${esc(p.info)}</p>`;await renderProject();show("project")}
async function renderProject(){let vs=(await all("visits")).filter(v=>v.projectId===cur).sort((a,b)=>b.created-a.created);$("visits").innerHTML=vs.length?`<table><tr><th>Datum</th><th>Bereich</th><th>Status</th><th>Priorität</th><th>Fotos</th><th>PDF</th></tr>${vs.map(v=>`<tr><td>${v.date}</td><td>${esc(v.area)}</td><td class="${v.status==="OK"||v.status==="Erledigt"?"ok":"bad"}">${v.status}</td><td>${v.priority}</td><td>${v.photos.length}</td><td><button onclick="onePDF('${v.id}')">📄</button></td></tr>`).join("")}</table>`:"Noch keine Besuche.";let op=vs.filter(v=>v.status==="Mangel"||v.status==="Nachbesserung");$("defects").innerHTML=op.length?op.map(v=>`<p><b>${esc(v.area)}</b> – ${v.priority}<br>${esc(v.comment)}${v.deadline?"<br>Frist: "+esc(v.deadline):""}<br><button onclick="done('${v.id}')">Als erledigt markieren</button></p>`).join(""):"Keine offenen Mängel."}
async function newVisit(){$("date").value=new Date().toISOString().slice(0,16);$("visitor").value="";$("comment").value="";$("photos").value="";show("visit")}
async function saveVisit(){let files=[...$("photos").files],photos=await Promise.all(files.map(f=>new Promise((a,b)=>{let r=new FileReader();r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})));await put("visits",{id:crypto.randomUUID(),projectId:cur,date:new Date($("date").value).toLocaleString("de-DE"),created:Date.now(),visitor:$("visitor").value,area:$("area").value,status:$("status").value,priority:$("priority").value,deadline:$("deadline").value,comment:$("comment").value,photos});alert("✅ Baustellenbesuch gespeichert");openProject(cur)}
function editProject(){get("projects",cur).then(p=>{name.value=p.name||"";address.value=p.address||"";builder.value=p.builder||"";contact.value=p.contact||"";company.value=p.company||"";number.value=p.number||"";start.value=p.start||"";end.value=p.end||"";info.value=p.info||"";show("editor")})}
async function done(id){let v=await get("visits",id);v.status="Erledigt";await put("visits",v);renderProject()}
function renderChecks(){let c=category.value;all("checks").then(xs=>{let z=xs.filter(x=>x.projectId===cur);checks.innerHTML=cats[c].map((x,i)=>{let q=z.find(k=>k.key===c+"_"+i);return `<label class="check"><input type="checkbox" ${q&&q.value?"checked":""} onchange="checkSave('${c}',${i},this.checked)"> ${x}</label>`}).join("")})}
async function checkSave(c,i,v){await put("checks",{id:cur+"_"+c+"_"+i,projectId:cur,key:c+"_"+i,value:v})}
function report(p,vs){let rows=vs.map(v=>`<tr><td>${v.date}</td><td>${esc(v.area)}</td><td>${esc(v.status)}</td><td>${esc(v.priority)}</td><td>${esc(v.visitor)}</td><td>${esc(v.comment)}</td></tr>`).join(""),imgs=vs.flatMap(v=>v.photos.map((x,i)=>`<div style="page-break-inside:avoid;margin:18px 0"><b>${v.date} – ${esc(v.area)} – Foto ${i+1}</b><br><img src="${x}" style="max-width:100%;max-height:500px"></div>`)).join("");let w=open("","_blank");if(!w)return alert("Bitte Pop-ups erlauben.");w.document.write(`<html><head><meta charset="utf-8"><title>Baustellenbericht</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #888;padding:7px;text-align:left}</style></head><body><h1>Baustellenbericht</h1><h2>${esc(p.name)}</h2><p><b>Adresse:</b> ${esc(p.address)}<br><b>Bauherr:</b> ${esc(p.builder)}<br><b>Baufirma:</b> ${esc(p.company)}<br><b>Projektnummer:</b> ${esc(p.number)}</p><table><tr><th>Datum</th><th>Bereich</th><th>Status</th><th>Priorität</th><th>Besucher</th><th>Kommentar</th></tr>${rows}</table><h2>Fotos</h2>${imgs}</body></html>`);w.document.close();setTimeout(()=>w.print(),700)}
async function onePDF(id){let p=await get("projects",cur),v=await get("visits",id);report(p,[v])}async function fullPDF(){let p=await get("projects",cur),vs=(await all("visits")).filter(v=>v.projectId===cur).sort((a,b)=>a.created-b.created);report(p,vs)}
$("category").innerHTML=Object.keys(cats).map(x=>`<option>${x}</option>`).join("");$("area").innerHTML=areas.map(x=>`<option>${x}</option>`).join("");$("category").onchange=renderChecks;
openDB().then(x=>{DB=x;home()}).catch(()=>alert("IndexedDB konnte nicht geöffnet werden."));
</script></body></html>
